services:
  db:
    image: mysql:8.4
    container_name: erp-db
    environment:
      MYSQL_DATABASE: erp
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: erp-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/erp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-random-secret-of-at-least-32-chars}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      APP_SEED: "true"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: erp-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
